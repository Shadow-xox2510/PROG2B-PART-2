name: RaceDay Part 3 CI

on:
  push:
    branches:
      - master
      - part-3

  pull_request:
    branches:
      - master
      - part-3

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API dependencies
        run: dotnet restore RaceDayAPI/RaceDayAPI.csproj

      - name: Restore MVC dependencies
        run: dotnet restore RaceDayMVC/RaceDayMVC.csproj

      - name: Restore test dependencies
        run: dotnet restore RaceDayAPI.Test/RaceDayAPI.Test.csproj

      - name: Build RaceDay API
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --configuration Release --no-restore

      - name: Build RaceDay MVC
        run: dotnet build RaceDayMVC/RaceDayMVC.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDayAPI.Test/RaceDayAPI.Test.csproj --configuration Release --no-restore