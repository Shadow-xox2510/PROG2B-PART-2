
name: RaceDay Part 2 CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI.slnx

      - name: Build solution
        run: dotnet build RaceDayAPI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDayAPI.slnx --configuration Release --no-build