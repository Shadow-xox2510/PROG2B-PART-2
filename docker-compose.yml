services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    networks:
      - raceday-network

  racedayapi:
    build:
      context: ./RaceDayAPI
      dockerfile: Dockerfile

    container_name: raceday-api

    ports:
      - "7079:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__RaceDayConnection: "Server=sqlserver,1433;Database=RaceDayDB2;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING}"
      AzureBlobStorage__ProfilePicturesContainer: "profilepictures"
      AzureBlobStorage__EventBannersContainer: "eventbanners"

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - raceday-network

  racedaymvc:
    build:
      context: ./RaceDayMVC
      dockerfile: Dockerfile

    container_name: raceday-mvc

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ApiSettings__BaseUrl: "http://racedayapi:8080/"

    depends_on:
      - racedayapi

    networks:
      - raceday-network

volumes:
  sqlserver_data:

networks:
  raceday-network:
    driver: bridge